<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTM Priority Runway</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#002857; --blue:#007FE9; --pale:#CEE2F4; --track:#EAF2FC; --ink:#333333; --muted:#647089; --line:#E3ECF7;
    --surface:#fff; --page:#FCFEFF; --head:#002857;
    --red:#B4231A; --red-bg:#FDECEA; --green:#0E7A4E; --green-bg:#E7F6EF; --amber:#8A4B08; --amber-bg:#FFF4DC;
    --card:0 12px 26px rgba(0,40,87,.09); --radius:16px;
    --bloom1:#DAEAFE; --bloom2:#EDF5FF; --bloom3:#DBFBF4; --bloom4:#D4E8FF;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --navy:#CEE2F4; --head:#E6F0FB; --blue:#4FA8F5; --pale:#2B4468; --track:#1B2B45; --ink:#DCE5F2; --muted:#9AAAC4; --line:#23364F;
      --surface:#112038; --page:#0A1424;
      --red:#FF8A80; --red-bg:#3B1A1A; --green:#5FD3A0; --green-bg:#12301F; --amber:#F3C26B; --amber-bg:#3A2C10;
      --card:0 12px 26px rgba(0,0,0,.35);
      --bloom1:#0F2342; --bloom2:#0C1A31; --bloom3:#0C2A2A; --bloom4:#10294A;
    }
  }
  *{box-sizing:border-box}
  html{background:var(--page)}
  body{margin:0;color:var(--ink);font:400 14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif;min-height:100vh;background:var(--page);-webkit-font-smoothing:antialiased}

  .tab{display:inline-block;background:var(--blue);color:#fff;font-weight:700;font-size:11px;letter-spacing:.17em;text-transform:uppercase;
    padding:9px 34px 9px 22px;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);margin-left:-20px}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 56px}
  header{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between;margin:14px 0 22px}
  h1{font-size:36px;line-height:1.08;letter-spacing:-.016em;margin:14px 0 6px;font-weight:900;color:var(--head)}
  .sub{color:var(--muted);margin:0;font-size:14px}
  .sync{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:700;padding:3px 11px;border-radius:99px;background:var(--green-bg);color:var(--green)}
  .sync.stale{background:var(--amber-bg);color:var(--amber)}
  .banner{border-radius:12px;padding:11px 16px;margin-bottom:14px;font-size:14px;box-shadow:var(--card);background:var(--amber-bg);color:var(--amber)}
  .banner.red{background:var(--red-bg);color:var(--red)}
  .banner b{font-weight:700}
  .banner ul{margin:6px 0 0;padding-left:20px}
  .answer{background:linear-gradient(135deg,#003C74,#002857);color:#fff;border-radius:var(--radius);padding:26px 30px;margin:18px 0 20px;box-shadow:0 16px 32px rgba(0,127,233,.13)}
  .answer p{margin:0;font-size:22px;line-height:1.35;font-weight:700;max-width:920px}
  .answer small{display:block;margin-top:10px;color:#B9D3F7;font-size:13px}
  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--surface);border-radius:var(--radius);box-shadow:var(--card);margin-bottom:20px;overflow:hidden}
  .strip a{padding:18px 20px;border-left:1px solid var(--line);color:inherit;text-decoration:none;display:block}
  .strip a:first-child{border-left:0}
  .strip a:hover,.strip a:focus-visible{background:var(--track);outline:none}
  .strip .k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
  .strip b{display:block;font-size:32px;font-weight:900;color:var(--head);font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px}
  .strip b.bad{color:var(--red)}
  .strip span{font-size:12.5px;color:var(--muted);display:block;line-height:1.35}
  .seg{display:inline-flex;flex-wrap:wrap;background:var(--surface);border-radius:12px;padding:4px;box-shadow:var(--card);margin-bottom:20px}
  .seg button{border:0;background:transparent;font:inherit;font-weight:500;color:var(--muted);padding:8px 16px;border-radius:9px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--navy);color:var(--page);font-weight:700}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--card);padding:24px 26px;margin-bottom:20px}
  .card h2{font-size:17px;margin:4px 0 2px;font-weight:900;color:var(--head)}
  .h2sub{color:var(--muted);font-size:13px;margin:0 0 16px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .task{background:var(--surface);border-radius:var(--radius);box-shadow:var(--card);padding:18px 20px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--blue)}
  .task.conf{border-top-color:var(--red)}
  .task.prop{border-top-style:dashed}
  .th{display:flex;gap:12px;align-items:flex-start}
  .rank{font-size:28px;font-weight:900;color:var(--blue);line-height:1;min-width:34px;font-variant-numeric:tabular-nums}
  .tt{font-weight:700;color:var(--head);font-size:15.5px;line-height:1.3}
  .tid{font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.04em}
  .score{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);white-space:nowrap}
  .score b{display:block;font-size:20px;color:var(--head);font-weight:900}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;gap:5px;align-items:center;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--track);color:var(--head);white-space:nowrap}
  .chip.red{background:var(--red-bg);color:var(--red)} .chip.green{background:var(--green-bg);color:var(--green)} .chip.amber{background:var(--amber-bg);color:var(--amber)}
  .chip.blue{background:var(--blue);color:#fff}
  .dates{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .dates b{color:var(--head);font-weight:700}
  .prop-d{border-bottom:1px dashed var(--muted);cursor:help}
  .need{font-size:13px;background:var(--track);border-radius:10px;padding:8px 12px;color:var(--ink)}
  .need b{color:var(--head)}
  .warn{font-size:13px;color:var(--red);background:var(--red-bg);border-radius:10px;padding:8px 12px}
  .edit{display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;color:var(--muted)}
  .edit label{display:inline-flex;gap:5px;align-items:center}
  select,input[type=text]{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--pale);border-radius:8px;padding:3px 6px}
  input[type=text]{width:120px}
  .btn{border:1px solid var(--pale);background:var(--surface);font:inherit;font-size:13px;font-weight:700;color:var(--head);padding:6px 14px;border-radius:9px;cursor:pointer}
  .btn:hover{border-color:var(--blue);color:var(--blue)}
  .rows .r{display:grid;grid-template-columns:34px 1fr auto auto;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
  .rows .r:first-child{border-top:0}
  .rows .n{font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums}
  .tbl{overflow-x:auto;margin:0 -26px -24px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  th:first-child,td:first-child{padding-left:26px} th:last-child,td:last-child{padding-right:26px}
  td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .gantt-g{margin-bottom:26px}
  .gantt-g:last-child{margin-bottom:0}
  .gh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;margin-bottom:8px}
  .gh b{color:var(--head);font-size:15px}
  .g{display:grid;grid-template-columns:minmax(150px,26%) 1fr;gap:14px;align-items:center;padding:5px 0;font-size:13px}
  .g .lab{color:var(--head);font-weight:500;line-height:1.3}
  .g .lab small{display:block;color:var(--muted);font-weight:400}
  .lane{position:relative;height:22px;background:var(--track);border-radius:6px}
  .bar{position:absolute;top:3px;bottom:3px;border-radius:5px;background:var(--navy)}
  .bar.pred{background:var(--blue)}
  .bar.bad{background:repeating-linear-gradient(135deg,var(--red) 0 5px,var(--red-bg) 5px 10px);border:1px solid var(--red)}
  .bar.prop{opacity:.75;background-image:repeating-linear-gradient(90deg,transparent 0 6px,rgba(255,255,255,.35) 6px 8px)}
  .gate{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--red);z-index:2}
  .gate span{position:absolute;top:-17px;left:3px;font-size:11px;color:var(--red);font-weight:700;white-space:nowrap}
  .axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin:2px 0 0 calc(26% + 14px)}
  .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:14px}
  .legend i{display:inline-block;width:14px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:6px}
  .brow{display:grid;grid-template-columns:150px 1fr 120px;gap:14px;align-items:center;padding:8px 0;font-size:14px}
  .stack{display:flex;height:16px;background:var(--track);border-radius:8px;overflow:hidden}
  .stack i{display:block;height:100%}
  .note{color:var(--muted);font-size:12.5px;margin:12px 0 0}
  footer{color:var(--muted);font-size:12.5px;margin-top:26px;line-height:1.6;max-width:900px}
  .empty{color:var(--muted)}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}.brow{grid-template-columns:100px 1fr 90px}.g{grid-template-columns:1fr}.axis{margin-left:0}h1{font-size:28px}.answer p{font-size:18px}}
  :root{--page:#F6F7F9;--surface:#fff;--line:#E6E8EC;--field:#F1F3F6;--hover:#F6F8FB;--card:0 0 0 1px #E6E8EC,0 1px 2px rgba(16,24,40,.04)}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#18191B;--surface:#212225;--line:#2E3035;--field:#2A2C30;--hover:#27292D;--card:0 0 0 1px #2E3035,0 1px 2px rgba(0,0,0,.3);--ink:#E8EAED;--muted:#9AA0AA;--head:#F2F4F7;--track:#2A2C30}}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
  /* priority list */
  .lw{background:var(--surface);border-radius:14px;box-shadow:var(--card);overflow:hidden}
  .lbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
  .fc{display:inline-flex;gap:6px;align-items:center;height:28px;padding:0 10px;border:0;border-radius:99px;background:transparent;color:var(--muted);font:500 12.5px Inter,sans-serif;cursor:pointer}
  .fc:hover{background:var(--hover)} .fc[aria-pressed="true"]{background:var(--field);color:var(--head);box-shadow:0 0 0 1px var(--line)}
  .fc em{font-style:normal;font-size:11px;padding:0 5px;border-radius:4px;background:var(--field);color:var(--muted)}
  .fc i{width:7px;height:7px;border-radius:50%}
  #q{margin-left:auto;width:200px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--field);padding:0 10px;font:13px Inter,sans-serif;color:var(--ink)}
  .scroll{overflow-x:auto}
  .lt{min-width:1190px}
  .lr{display:grid;grid-template-columns:46px 84px minmax(260px,1fr) 128px 132px 62px 62px 40px 138px 86px;gap:10px;align-items:center;padding:0 14px;min-height:52px;border-bottom:1px solid var(--line)}
  .lr.h{min-height:34px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--page);position:sticky;top:0;z-index:3}
  .lr.h button{all:unset;cursor:pointer} .lr.h button:hover{color:var(--head)}
  .lr.b:hover{background:var(--hover)}
  .gh2{display:flex;gap:10px;align-items:baseline;padding:14px 14px 8px;background:var(--surface);border-bottom:1px solid var(--line);cursor:default}
  .gh2 b{font-size:13px;color:var(--head)} .gh2 span{font-size:12.5px;color:var(--muted)} .gh2 .tg{margin-left:auto;cursor:pointer;color:var(--blue);font-size:12.5px;font-weight:500}
  .rk{font:500 15px "JetBrains Mono",monospace;color:var(--head);text-align:center}
  .pp{display:inline-flex;align-items:center;justify-content:center;height:22px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:600}
  .pp.Now{background:var(--blue);color:#fff} .pp.Next{background:rgba(240,154,47,.18);color:#C77A12} .pp.Later{background:var(--field);color:var(--muted)} .pp.Blocked{background:var(--red-bg);color:var(--red)} .pp.Done{background:var(--green-bg);color:var(--green)}
  .tc{min-width:0;cursor:pointer;padding:8px 0}
  .tc .t1{font-weight:600;color:var(--head);font-size:13.5px;line-height:1.3}
  .tc .t2{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;align-items:center}
  .sbar{height:3px;border-radius:2px;background:var(--field);margin-top:5px;max-width:160px} .sbar i{display:block;height:100%;border-radius:2px;background:var(--blue)}
  .lr select,.lr input[type=text],.lr input[type=date]{width:100%;height:28px;border-radius:7px;border:1px solid transparent;background:transparent;font:500 12.5px Inter,sans-serif;color:var(--ink);padding:0 6px}
  .lr select:hover,.lr input:hover{border-color:var(--line);background:var(--field)}
  .lr select.st{font-weight:600;border-radius:6px;padding:0 6px}
  .st.s-In-progress{background:rgba(0,127,233,.16);color:var(--blue)} .st.s-Blocked{background:var(--red-bg);color:var(--red)} .st.s-Complete,.st.s-Phase-1-done{background:var(--green-bg);color:var(--green)} .st.s-Queued{background:var(--amber-bg);color:var(--amber)} .st.s-Not-started{background:var(--field);color:var(--muted)} .st.s-Undefined{background:var(--amber-bg);color:var(--amber)}
  .lr input.un{border:1px dashed var(--line);color:var(--muted)} .lr input.un::placeholder{color:var(--muted)} .lr input.un.hot{border-color:var(--red)} .lr input.un.hot::placeholder{color:var(--red)}
  .cdot{width:10px;height:10px;border-radius:50%;margin:auto;display:block}
  .cdot.green{background:var(--green)} .cdot.amber{background:#E5A300} .cdot.red{background:var(--red)}
  .dd{display:flex;flex-direction:column;gap:1px} .dd small{font-size:11px;color:var(--muted);padding-left:6px}
  .sc{font:500 13px "JetBrains Mono",monospace;text-align:right;color:var(--head)}
  .dt{padding:6px 14px 16px 70px;background:var(--hover);border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;font-size:13px}
  .dt .warn,.dt .need{grid-column:1/-1}
  .dt label{display:flex;gap:8px;align-items:center;color:var(--muted)} .dt label input,.dt label select{width:auto;border-color:var(--line);background:var(--surface)}
  .fl{display:inline-flex;gap:3px;align-items:center;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--field);color:var(--muted)} .fl.r{background:var(--red-bg);color:var(--red)} .fl.a{background:var(--amber-bg);color:var(--amber)}
  .nores{padding:28px;text-align:center;color:var(--muted)}
  .answer{background:none;color:var(--head);box-shadow:none;padding:0;margin:4px 0 16px}
  .answer p{font-size:17px;font-weight:600;max-width:none} .answer small{color:var(--muted)}
  .strip b{font-size:24px} .strip a{padding:12px 16px}
  .strip .k{letter-spacing:.06em;font-weight:600}
  .banner{box-shadow:none;font-size:13px;padding:9px 14px;margin-bottom:8px;border-radius:10px}
  h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
  .tab{display:none}
  .seg{box-shadow:var(--card);border-radius:10px} .seg button{font-size:13px;padding:6px 14px;border-radius:7px}
  .card,.strip{box-shadow:var(--card);border-radius:14px}
  .wrap{max-width:1320px}
  .strip span{display:none} .strip a{padding:10px 14px} .strip b{font-size:22px;margin-top:2px}
  .answer{margin:2px 0 12px} .answer small{display:none}
  .strip{margin-bottom:14px} .seg{margin-bottom:12px}
  header{margin:6px 0 10px} .sub{font-size:12.5px}
  #banners{margin-top:16px}


  .ins{background:var(--surface);border-radius:14px;box-shadow:var(--card);padding:14px 18px 16px;margin-bottom:14px}
  .ins .ih{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--head);font-size:13.5px}
  .ins .ih em{font-style:normal;color:var(--muted);font-weight:500}
  .ins .nav{margin-left:auto;display:flex;gap:2px}
  .ins .pg{display:flex;align-items:center;gap:2px}
  .ins .pg em{min-width:44px;text-align:center}
  .ib{all:unset;cursor:pointer;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--muted)} .ib:hover{background:var(--field);color:var(--head)}
  .ins p{margin:8px 0 10px;font-size:14.5px;line-height:1.5;color:var(--ink);max-width:860px}
  .neg{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--red)} .pos{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--green)}
  .dotp{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:0;margin-right:4px}
  .pillb{all:unset;cursor:pointer;display:inline-flex;align-items:center;height:30px;padding:0 14px;border-radius:99px;background:var(--field);box-shadow:0 0 0 1px var(--line);font:500 13px Inter,sans-serif;color:var(--head);margin-right:8px}
  .pillb:hover{background:var(--hover)} .pillb.pri{background:var(--blue);color:#fff;box-shadow:none}
  .df{border-radius:12px;box-shadow:0 0 0 1px var(--line);overflow:hidden;margin:6px 0 8px;max-width:960px}
  .df .dh{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;color:var(--head);font-size:13px} .df .dh span{font-weight:400;color:var(--muted);font-size:12.5px}
  .df .dr{display:grid;grid-template-columns:64px 1fr 170px 44px 26px;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
  .df .dr.on{background:rgba(229,72,77,.12)} .df .dr.on .dn{color:var(--red)}
  .df .dr .mono{white-space:nowrap;font-size:12px} .dfb{max-height:250px;overflow-y:auto} .df .dr .dn{font-weight:500;color:var(--head)}
  .df .arrow{font-size:12.5px;color:var(--muted)} .df .arrow s{color:var(--red)} .df .arrow b{color:var(--green);font-weight:600}
  .ck{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;color:#fff;font-size:13px}
  .on .ck{background:var(--red);border-color:var(--red)}
  .df .dfoot{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:12.5px;color:var(--muted)}
  .btnp{all:unset;cursor:pointer;height:32px;padding:0 16px;border-radius:99px;background:var(--blue);color:#fff;font:600 13px Inter,sans-serif;display:inline-flex;align-items:center}
  .btnp[disabled]{opacity:.45;cursor:default}
  .ask{background:var(--surface);border-radius:14px;box-shadow:var(--card);padding:16px 18px;max-width:520px;margin-top:18px}
  .ask h3{margin:0 0 10px;font-size:15px;color:var(--head);font-weight:600}
  .ask .op{display:flex;gap:10px;align-items:center;padding:7px 4px;cursor:pointer;border-radius:8px;color:var(--ink)} .ask .op:hover{background:var(--hover)}

<script>
// Runway model: merges the seed with the overlay, derives status, dates, conflicts and score.
// Plain functions, no DOM. Inlined into runway.html by build.js and required by tests.
(function (root) {
  var DAY = 86400000;
  function d(s) { return s ? Date.parse(s + 'T00:00:00Z') : null; }
  function iso(t) { return t == null ? null : new Date(t).toISOString().slice(0, 10); }
  function days(a, b) { return Math.round((a - b) / DAY); }

  var CONF_W = { green: 1.0, amber: 0.7, red: 0.4 };

  function urgencyFor(t, today) {

  }

  function build(seed, overlay, today, overrides) {

    var tasks = seed.tasks.concat(overlay.added_tasks || []).map(function (s) {
      var t = JSON.parse(JSON.stringify(s));

      if (o.delivery) t.delivery_actual = o.delivery;
      if (o.blocker_type !== undefined && o.blocker_type !== '') t.blocker_type = o.blocker_type === 'none' ? null : o.blocker_type;

      t.delivery_src = t.delivery_actual ? 'tab1' : t.delivery_proposed ? 'proposed' : null;

    var byId = {}; tasks.forEach(function (t) { byId[t.id] = t; });

    var kids = {}; tasks.forEach(function (t) { t.depends_on.forEach(function (p) { (kids[p] = kids[p] || []).push(t.id); }); });
    function reach(id, seen) { (kids[id] || []).forEach(function (k) { if (!seen[k]) { seen[k] = 1; reach(k, seen); } }); return seen; }

    tasks.forEach(function (t) {
      t.downstream = Object.keys(reach(t.id, {}));

    });

    var ord = overrides._order || [], oi = {}; ord.forEach(function (id, i) { oi[id] = i; });

      if (t.score == null) t.bucket = t.status === 'Undefined' ? 'Undefined' : 'Archive';
    });

    var pause = inprog.slice().sort(function (a, b) { return (b.rank || 999) - (a.rank || 999); });
    var cpm = tasks.filter(function (t) { return t.conflicts.length; });

      order: ranked.map(function (t) { return t.id; }), manual: ord.length > 0,
      today: iso(today), tasks: tasks, byId: byId, limit: limit,
      wip: inprog.length, wip_over: Math.max(0, inprog.length - limit),
      pause_candidates: pause.slice(0, Math.max(0, inprog.length - limit)),

  }

  if(el.dataset&&el.dataset.sel){keepScroll(function(){sel[el.dataset.sel]=el.checked;});}
  else if(el.dataset&&el.dataset.selall){keepScroll(function(){lastVisible.forEach(function(id){sel[id]=el.checked;});});}
},true);
function bulkApply(w,val){
  var ids=Object.keys(sel).filter(function(k){return sel[k];}); if(!ids.length||!val) return;
  keepScroll(function(){ids.forEach(function(id){ov[id]=ov[id]||{}; ov[id][w]=val;}); saveOv(ov); sel={};});
  toast(w==='owner'?ids.length+' task'+(ids.length>1?'s':'')+' assigned to <b>'+esc(val)+'</b>.':ids.length+' task'+(ids.length>1?'s':'')+' set to <b>'+esc(val)+'</b>.');
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-bulk]'); if(!b) return;
  var w=b.dataset.bulk;
  if(w==='clear'){keepScroll(function(){sel={};});return;}
  if(w==='owner') bulkApply('owner',document.getElementById('bo').value.trim());
});
document.addEventListener('change',function(e){ if(e.target.id==='bs'&&e.target.value) bulkApply('status',e.target.value); });
document.addEventListener('keydown',function(e){
  if(e.target.id==='bo'&&e.key==='Enter'){e.preventDefault(); bulkApply('owner',e.target.value.trim());}
  else if(e.key==='Escape'&&Object.keys(sel).some(function(k){return sel[k];})&&!document.getElementById('pal').classList.contains('on')&&!drag){keepScroll(function(){sel={};});}
  else if(e.key==='Escape'&&openId&&!document.getElementById('pal').classList.contains('on')&&!drag){var id=openId; openId=null; var y=window.scrollY; render(); window.scrollTo(0,y); var tb=document.querySelector('button.t1[data-toggle="'+id+'"]'); if(tb) tb.focus({preventScroll:true});}
});
function bulkBar(){
  var host=document.getElementById('bulkbar'), ids=Object.keys(sel).filter(function(k){return sel[k];}), n=ids.length;
  var keep=document.getElementById('bo'), tv=keep?keep.value:'', hadFocus=keep&&document.activeElement===keep;
  document.body.classList.toggle('hasbulk',n>0);
  if(!n){host.innerHTML=''; host.classList.remove('on'); return;}
  host.classList.add('on');
  host.innerHTML='<button class="bx0" data-bulk="clear" aria-label="Clear selection" title="Clear selection (Esc)"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>'+
   '<span class="bn"><b>'+n+'</b> selected</span><i class="bsep"></i>'+
   '<label class="bf"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="4.5" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 12c.5-2.3 2.4-3.4 4.5-3.4s4 1.1 4.5 3.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><input id="bo" type="text" placeholder="Assign owner" autocomplete="off" aria-label="Owner for selected tasks"></label>'+
   '<button class="bgo" data-bulk="owner">Assign</button><i class="bsep"></i>'+
   '<select id="bs" class="bsel" aria-label="Set status for selected tasks"><option value="">Set status</option>'+STATUSES.map(function(o){return '<option>'+o+'</option>';}).join('')+'</select>';
  var bo=document.getElementById('bo'); bo.value=tv; if(hadFocus){bo.focus(); bo.setSelectionRange(tv.length,tv.length);}
}
function syncSelAll(){
  var h=document.getElementById('selall'); if(!h) return;
  var n=lastVisible.length, c=lastVisible.filter(function(id){return sel[id];}).length;
  h.checked=n>0&&c===n; h.indeterminate=c>0&&c<n;
}
/* ---- jump to (command search) ---- */
var palSel=0, palRes=[], palPrev=null;
function palRender(){
  var qv=document.getElementById('palq').value.trim().toLowerCase();
  palRes=model.tasks.filter(function(t){return !qv||(t.task+' '+t.id+' '+t.workstream+' '+(t.owner||'')+' '+t.status).toLowerCase().indexOf(qv)>=0;}).sort(function(a,b){return (a.rank||999)-(b.rank||999);}).slice(0,9);
  palSel=Math.min(palSel,Math.max(0,palRes.length-1));
  document.getElementById('palres').innerHTML=palRes.length?palRes.map(function(t,i){return '<div class="it'+(i===palSel?' on':'')+'" data-go="'+t.id+'">'+stIcon(t.status)+'<span class="mono">'+esc(t.id)+'</span><span>'+esc(t.task.length>70?t.task.slice(0,68)+'...':t.task)+'</span><span class="rn">'+(t.rank?'#'+t.rank:esc(t.status))+'</span></div>';}).join(''):'<div class="em">No task matches.</div>';
}
function palOpen(){palPrev=document.activeElement; document.getElementById('pal').classList.add('on'); var i=document.getElementById('palq'); i.value=''; palSel=0; palRender(); i.focus();}
function palClose(){document.getElementById('pal').classList.remove('on'); if(palPrev&&palPrev.focus&&document.contains(palPrev)) palPrev.focus();}
function goTask(id){
  var t=model.byId[id]; if(!t) return; palClose();
  view='now'; flt=null; q=''; collapsed[groupOf(t)]=false; openId=id; history.replaceState(null,'','#now'); render();
  var el=document.querySelector('[data-row="'+id+'"]'); if(el){el.scrollIntoView({block:'center'}); el.classList.add('flash');}
}
document.addEventListener('keydown',function(e){
  var pal=document.getElementById('pal');
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault(); pal.classList.contains('on')?palClose():palOpen(); return;}
  if(!pal.classList.contains('on')) return;
  if(e.key==='Tab'){e.preventDefault(); document.getElementById('palq').focus();}
  else if(e.key==='Escape') palClose();
  else if(e.key==='ArrowDown'){e.preventDefault(); palSel=Math.min(palSel+1,palRes.length-1); palRender();}
  else if(e.key==='ArrowUp'){e.preventDefault(); palSel=Math.max(palSel-1,0); palRender();}
  else if(e.key==='Enter'&&palRes[palSel]){e.preventDefault(); goTask(palRes[palSel].id);}
});
document.addEventListener('click',function(e){
  if(e.target.closest('[data-pal]')){palOpen(); return;}
  var g=e.target.closest('[data-go]'); if(g){goTask(g.dataset.go); return;}
  if(e.target.id==='pal') palClose();
});
document.addEventListener('input',function(e){ if(e.target.id==='palq'){palSel=0; palRender();} });
window.addEventListener('hashchange',function(){route();render();});

/* ---- manual priority order: drag, keyboard, type a number ---- */
var toastT=null, undoOrder=null;
function toast(msg,undo){var t=document.getElementById('toast'); t.innerHTML='<span>'+msg+'</span>'+(undo?'<button data-undoorder="1">Undo</button>':''); t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('on');},6000);}
function openIds(){return model.order.filter(function(id){return model.byId[id].rank!=null;});}
function moveTask(id,idx){ // idx = new 0-based position among open tasks
  var full=model.order.slice(), op=openIds(); if(op.indexOf(id)<0) return;
  var before=model.byId[id].bucket, prevOrder=ov._order?ov._order.slice():null;
  full.splice(full.indexOf(id),1);
  var rest=full.filter(function(x){return model.byId[x].rank!=null;});
  idx=Math.max(0,Math.min(rest.length,idx));
  if(idx>=rest.length) full.push(id); else full.splice(full.indexOf(rest[idx]),0,id);
  ov._order=full; saveOv(ov); undoOrder=prevOrder;
  var y=window.scrollY; render(); window.scrollTo(0,y);
  var t=model.byId[id], msg='<b>'+esc(shortName(t))+'</b> is now #'+t.rank;
  if(t.bucket!==before){
    msg+=t.bucket==='Now'?' and in Now.':' and in '+t.bucket+'.';
    var d=model.tasks.filter(function(x){return x.rank===(t.bucket==='Now'?model.limit+1:before==='Now'?model.limit:0);})[0];
    if(d&&d.id!==id) msg+=' '+esc(shortName(d))+(t.bucket==='Now'?' moves to Next.':' moves up to Now.');
  }
  toast(msg,true);
  return t;
}
document.addEventListener('click',function(e){
  if(e.target.closest('[data-undoorder]')){ if(undoOrder) ov._order=undoOrder; else delete ov._order; undoOrder=null; saveOv(ov); document.getElementById('toast').classList.remove('on'); var y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(e.target.closest('[data-resetorder]')){ undoOrder=ov._order.slice(); delete ov._order; saveOv(ov); render(); toast('Back to the suggested order.',true); return; }
  var rb=e.target.closest('[data-rankedit]'); if(rb){
    var id=rb.dataset.rankedit, host=rb.parentElement, n=openIds().length;
    host.innerHTML='<input class="rkin" type="number" min="1" max="'+n+'" value="'+model.byId[id].rank+'" aria-label="New priority number for '+esc(id)+'">';
    var inp=host.firstChild; inp.focus(); inp.select(); var done=false;
    var fin=function(commit){ if(done) return; done=true; var v=parseInt(inp.value,10); if(commit&&v>=1&&v!==model.byId[id].rank) moveTask(id,Math.min(v,n)-1); else render(); };
    inp.addEventListener('keydown',function(ev){ if(ev.key==='Enter'){ev.preventDefault();fin(true);} else if(ev.key==='Escape'){fin(false);} });
    inp.addEventListener('blur',function(){fin(true);});
    return;
  }
},true);
document.addEventListener('keydown',function(e){
  var gr=e.target.closest&&e.target.closest('[data-grip]'); if(!gr) return;
  var id=gr.dataset.grip, t=model.byId[id], k=e.key;
  if(k!=='ArrowUp'&&k!=='ArrowDown'&&k!=='Home'&&k!=='End') return;
  e.preventDefault();
  var to=k==='ArrowUp'?t.rank-2:k==='ArrowDown'?t.rank:k==='Home'?0:openIds().length;
  if(to<0||to>openIds().length) return;
  moveTask(id,to);
  var g=document.querySelector('[data-grip="'+id+'"]'); if(g) g.focus();
});
var drag=null;
document.addEventListener('pointerdown',function(e){
  var gr=e.target.closest&&e.target.closest('[data-grip]'); if(!gr||e.button>0) return;
  var row=gr.closest('.lr'); drag={id:gr.dataset.grip,row:row,gr:gr,y0:e.clientY,s0:window.scrollY,on:false,ref:null,after:false,py:e.clientY};
  try{gr.setPointerCapture(e.pointerId);}catch(x){}
});
function dragTick(){
  if(!drag||!drag.on) return;
  var vh=window.innerHeight, y=drag.py;
  if(y<70) window.scrollBy(0,-12); else if(y>vh-70) window.scrollBy(0,12);
  dragUpdate(); requestAnimationFrame(dragTick);
}
function dragUpdate(){
  var d=drag; d.row.style.transform='translateY('+((d.py-d.y0)+(window.scrollY-d.s0))+'px)';
  var rows=[].slice.call(document.querySelectorAll('.lr.b[data-row]')).filter(function(r){return r!==d.row&&r.querySelector('[data-grip]');});
  var ref=null, after=false, line=document.getElementById('dropline'), box=d.row.closest('.lt').getBoundingClientRect();
  for(var i=0;i<rows.length;i++){var b=rows[i].getBoundingClientRect(); if(d.py<b.top+b.height/2){ref=rows[i];break;}}
  var yy;
  if(ref){yy=ref.getBoundingClientRect().top;}
  else if(rows.length){ref=rows[rows.length-1]; after=true; yy=ref.getBoundingClientRect().bottom;}
  d.ref=ref?ref.dataset.row:null; d.after=after;
  line.style.display=ref?'block':'none'; if(ref){line.style.top=(yy-1)+'px'; line.style.left=box.left+'px'; line.style.width=box.width+'px';}
}
document.addEventListener('pointermove',function(e){
  if(!drag) return; drag.py=e.clientY;
  if(!drag.on){ if(Math.abs(e.clientY-drag.y0)<4) return; drag.on=true; drag.row.classList.add('drag'); document.body.classList.add('dragging'); requestAnimationFrame(dragTick); }
  dragUpdate();
});
function dragEnd(commit){
  if(!drag) return; var d=drag; drag=null;
  document.body.classList.remove('dragging'); document.getElementById('dropline').style.display='none'; d.row.classList.remove('drag'); d.row.style.transform='';
  if(!d.on||!commit||!d.ref||d.ref===d.id) return;
  var op=openIds().filter(function(x){return x!==d.id;}), ri=op.indexOf(d.ref); if(ri<0) return;
  moveTask(d.id,d.after?ri+1:ri);
  var g=document.querySelector('[data-grip="'+d.id+'"]'); if(g) g.focus({preventScroll:true});
}
document.addEventListener('pointerup',function(){dragEnd(true);});
document.addEventListener('pointercancel',function(){dragEnd(false);});
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&drag) dragEnd(false); });


document.addEventListener('click',function(e){
  var m=e.target.closest('[data-mv]'); if(!m||m.disabled) return;
  var id=m.dataset.id2, t=model.byId[id], w=m.dataset.mv;
  moveTask(id,w==='top'?0:w==='up'?t.rank-2:t.rank);
  var again=document.querySelector('[data-mv="'+w+'"][data-id2="'+id+'"]'); if(again&&!again.disabled) again.focus({preventScroll:true});
},true);

/* ---- right-side detail drawer ---- */
function drawerRender(){
  if(msOpen&&msOpen.id!==openId) msOpen=null;
  var d=document.getElementById('drawer'), t=openId&&model.byId[openId];
  var keep=d.querySelector('.dwb'), st=keep?keep.scrollTop:0;
  if(!t){d.classList.remove('on'); d.innerHTML=''; document.body.classList.remove('hasdrawer'); return;}
  var i=lastVisible.indexOf(t.id);
  d.setAttribute('role','dialog'); d.setAttribute('aria-modal','false'); d.setAttribute('aria-label','Details for '+t.id);
  d.innerHTML='<div class="dwh"><span class="mono">'+esc(t.id)+' &middot; '+esc(t.workstream)+'</span><div class="dwa"><button data-nav="-1" aria-label="Previous task" title="Previous task"'+(i<=0?' disabled':'')+'>&#8593;</button><button data-nav="1" aria-label="Next task" title="Next task"'+(i<0||i>=lastVisible.length-1?' disabled':'')+'>&#8595;</button><button data-closedw="1" aria-label="Close details" title="Close (Esc)"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div></div><div class="dwb">'+detailHtml(t)+'</div>';
  d.classList.add('on'); document.body.classList.add('hasdrawer');
  d.querySelector('.dwb').scrollTop=st;
  var ti=d.querySelector('.dti'); if(ti) fitTitle(ti);
}
document.addEventListener('click',function(e){
  if(e.target.closest('[data-closedw]')){var id=openId; openId=null; var y=window.scrollY; render(); window.scrollTo(0,y); var tb=document.querySelector('button.t1[data-toggle="'+id+'"]'); if(tb) tb.focus({preventScroll:true}); return;}
  var n=e.target.closest('[data-nav]'); if(n&&!n.disabled){var i=lastVisible.indexOf(openId)+Number(n.dataset.nav); if(i>=0&&i<lastVisible.length){openId=lastVisible[i]; render(); var r=document.querySelector('[data-row="'+openId+'"]'); if(r) r.scrollIntoView({block:'nearest'}); var nb=document.querySelector('[data-nav="'+n.dataset.nav+'"]'); if(nb&&!nb.disabled) nb.focus({preventScroll:true});}}
},true);

/* ---- editable task name ---- */
function fitTitle(el){el.style.height='auto'; el.style.height=el.scrollHeight+'px';}
function saveTitle(el){var id=el.dataset.title, v=el.value.replace(/\s+/g,' ').trim(), cur=model.byId[id]; if(!cur) return; var base=cur.task_source||cur.task; if(!v||v===base){ if(ov[id]) delete ov[id].title; saveOv(ov);} else if(v!==cur.task){ ovSet(id,'title',v); } else return; var y=window.scrollY; render(); window.scrollTo(0,y); toast('Name updated.',false);}
document.addEventListener('input',function(e){var n=e.target; if(n.dataset&&n.dataset.title!=null) fitTitle(n);});
document.addEventListener('keydown',function(e){var n=e.target; if(!n.dataset||n.dataset.title==null) return; if(e.key==='Enter'){e.preventDefault(); n.blur();} else if(e.key==='Escape'){e.stopPropagation(); n.value=model.byId[n.dataset.title].task; n.blur();}},true);
document.addEventListener('focusout',function(e){var n=e.target; if(n.dataset&&n.dataset.title!=null) saveTitle(n);});
document.addEventListener('click',function(e){var b=e.target.closest('[data-titlereset]'); if(!b) return; var id=b.dataset.titlereset; if(ov[id]) delete ov[id].title; saveOv(ov); var y=window.scrollY; render(); window.scrollTo(0,y); toast('Original name restored.',false);},true);
/* ---- notes, steps, links (all saved in this browser, exported by Copy changes) ---- */
function ovSet(id,k,v){ov[id]=ov[id]||{}; ov[id][k]=v; saveOv(ov);}
function reDrawer(focusSel){var y=window.scrollY; render(); window.scrollTo(0,y); if(focusSel){var f=document.querySelector(focusSel); if(f) f.focus({preventScroll:true});}}
var noteT=null;
document.addEventListener('input',function(e){
  var n=e.target; if(!n.dataset||!n.dataset.note) return;
  n.style.height='auto'; n.style.height=Math.min(n.scrollHeight,320)+'px';
  var c=document.getElementById('ntc'), st=document.getElementById('nts'); if(c) c.textContent=n.value.length+' characters'; if(st) st.textContent='Saving...';
  clearTimeout(noteT); noteT=setTimeout(function(){ovSet(n.dataset.note,'notes',n.value); if(st) st.textContent='Saved in this browser';},300);
});
document.addEventListener('focusout',function(e){var n=e.target; if(n.dataset&&n.dataset.note){clearTimeout(noteT); ovSet(n.dataset.note,'notes',n.value); var st=document.getElementById('nts'); if(st) st.textContent='Saved in this browser'; }});
document.addEventListener('change',function(e){
  var el=e.target; if(!el.dataset) return;
  if(el.dataset.stepck!=null){var a=stepsOf(el.dataset.tid).slice(); a[el.dataset.stepck]={t:a[el.dataset.stepck].t,d:el.checked}; ovSet(el.dataset.tid,'steps',a); reDrawer(); }
  else if(el.dataset.stepin!=null){var a2=stepsOf(el.dataset.tid).slice(), i=Number(el.dataset.stepin), v=el.value.trim(); if(v) a2[i]={t:v,d:a2[i].d}; else a2.splice(i,1); ovSet(el.dataset.tid,'steps',a2); reDrawer();}
},true);
function addStep(id){var inp=document.getElementById('stnew'), v=inp.value.trim(); if(!v) return; ovSet(id,'steps',stepsOf(id).concat([{t:v,d:false}])); reDrawer('#stnew');}
function addLink(id){var inp=document.getElementById('lknew'), v=inp.value.trim(); if(!v) return; if(!/^https?:\/\//i.test(v)) v='https://'+v; try{var u=new URL(v); if(u.protocol!=='http:'&&u.protocol!=='https:') throw 0; v=u.href;}catch(x){inp.setAttribute('aria-invalid','true'); inp.title='That does not look like a link'; return;} ovSet(id,'links',linksOf(id).concat([{u:v}])); reDrawer('#lknew');}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-stepadd],[data-stepdel],[data-stepseed],[data-linkadd],[data-linkdel]'); if(!el) return;
  var d=el.dataset;
  if(d.stepadd) addStep(d.stepadd);
  else if(d.stepdel!=null){var a=stepsOf(d.tid).slice(); a.splice(Number(d.stepdel),1); ovSet(d.tid,'steps',a); reDrawer();}
  else if(d.stepseed){var t=model.byId[d.stepseed]; var items=t.missing_per_checklist_tab.split(/,\s*(?:and\s+)?|\s+and\s+/).map(function(x){return x.trim();}).filter(Boolean); ovSet(d.stepseed,'steps',items.map(function(x){return {t:x.charAt(0).toUpperCase()+x.slice(1),d:false};})); reDrawer();}
  else if(d.linkadd) addLink(d.linkadd);
  else if(d.linkdel!=null){var l=linksOf(d.tid).slice(); l.splice(Number(d.linkdel),1); ovSet(d.tid,'links',l); reDrawer();}
},true);
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter') return; var t=e.target;
  if(t.id==='stnew'){e.preventDefault(); addStep(t.dataset.tid);} else if(t.id==='lknew'){e.preventDefault(); addLink(t.dataset.tid);}
  else if(t.dataset&&t.dataset.stepin!=null){e.preventDefault(); t.blur();}
});

/* ---- connections: multi-select pickers ---- */
function setEdge(child,parent,on){var cur=(model.byId[child].depends_on||[]).slice(), i=cur.indexOf(parent); if(on&&i<0) cur.push(parent); else if(!on&&i>=0) cur.splice(i,1); ovSet(child,'depends_on',cur);}
function edgeToggle(tid,mode,other,on){ if(mode==='up') setEdge(tid,other,on); else setEdge(other,tid,on); }
document.addEventListener('click',function(e){
  var o=e.target.closest('[data-msopen]'); if(o){var m=o.dataset.msopen; msOpen=(msOpen&&msOpen.id===openId&&msOpen.mode===m)?null:{id:openId,mode:m}; msQ=''; drawerRender(); if(msOpen){var q=document.getElementById('msq'); if(q) q.focus({preventScroll:true});} else {var b=document.querySelector('[data-msopen="'+m+'"]'); if(b) b.focus({preventScroll:true});} return;}
  var d=e.target.closest('[data-msdel]'); if(d){edgeToggle(d.dataset.tid,d.dataset.mode,d.dataset.msdel,false); reDrawer(); toast('Connection removed.'); return;}
},true);
document.addEventListener('change',function(e){
  var c=e.target; if(!c.dataset||!c.dataset.msck) return;
  edgeToggle(c.dataset.tid,c.dataset.mode,c.dataset.msck,c.checked);
  reDrawer('[data-msck="'+c.dataset.msck+'"][data-mode="'+c.dataset.mode+'"]');
},true);
document.addEventListener('input',function(e){
  if(e.target.id!=='msq') return; msQ=e.target.value; drawerRender(); var q=document.getElementById('msq'); q.focus({preventScroll:true}); q.setSelectionRange(msQ.length,msQ.length);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&msOpen){e.stopImmediatePropagation(); var m=msOpen.mode; msOpen=null; drawerRender(); var b=document.querySelector('[data-msopen="'+m+'"]'); if(b) b.focus({preventScroll:true});}
},true);
route(); render();
</script>
