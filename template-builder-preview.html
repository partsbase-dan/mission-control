<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email Template Builder — Live Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#002857;
    --blue:#0C70E8;
    --paper:#F5F7FB;
    --surface:#FFFFFF;
    --ink:#26324A;
    --ink-soft:#5B6B85;
    --line:#DCE3EE;
    --line-soft:#EAEFF6;
    --amber:#905C0B;
    --amber-bg:#FBF1DF;
    --good:#0C7C55;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Roboto', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace;}

  header.top{ background:var(--navy); color:#fff; padding:18px 24px; }
  header.top .row{ max-width:1400px; margin:0 auto; display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  header.top .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.09em;
    text-transform:uppercase; color:#8FB6EE; margin-bottom:4px;
  }
  header.top h1{ margin:0; font-size:21px; font-weight:700; }

  .shell{ max-width:1400px; margin:0 auto; padding:20px 24px 40px; }

  .layout{ display:grid; grid-template-columns:220px minmax(360px,1fr) minmax(380px,560px); gap:20px; align-items:start; }
  @media (max-width:1100px){ .layout{ grid-template-columns:220px 1fr; } .preview-col{ grid-column:1 / -1; } }
  @media (max-width:640px){ .layout{ grid-template-columns:1fr; } }

  .picker{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:10px; position:sticky; top:16px;
  }
  .picker .picker-btn{
    display:block; width:100%; text-align:left; border:none; background:none;
    padding:11px 11px; border-radius:8px; cursor:pointer; font-family:inherit;
    font-size:13.5px; color:var(--ink); margin-bottom:2px;
  }
  .picker .picker-btn .n{ display:block; font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .picker .picker-btn:hover{ background:var(--line-soft); }
  .picker .picker-btn.active{ background:var(--navy); color:#fff; }
  .picker .picker-btn.active .n{ color:#9DBBE8; }

  .panel{ display:none; }
  .panel.active{ display:contents; }

  .form-col{}
  .panel-card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:20px 22px;
  }
  .panel-card h2{ margin:0 0 6px; font-size:18px; color:var(--navy); }
  .panel-card .use{ color:var(--ink-soft); font-size:13px; line-height:1.5; margin-bottom:16px; }
  .panel-card + .panel-card{ margin-top:14px; }

  .section-toggle{
    display:flex; align-items:baseline; gap:8px; cursor:pointer; margin-bottom:2px;
    font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
  }
  .section-toggle input{ margin:0; accent-color:var(--blue); cursor:pointer; }
  .section-toggle span:nth-of-type(1){ font-size:14px; text-transform:none; letter-spacing:0; font-family:'Roboto',sans-serif; font-weight:700; color:var(--navy); }
  .section-toggle-hint{ color:var(--ink-soft); font-weight:400 !important; }
  .section-fields{ margin-top:14px; }
  .section-card.section-excluded{ background:var(--line-soft); }
  .section-card.section-excluded .section-fields{ opacity:.4; pointer-events:none; }

  .field{ margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--line-soft); }
  .field:last-of-type{ border-bottom:none; }
  .field label{ display:block; font-weight:500; font-size:13px; margin-bottom:5px; color:var(--ink); }
  .field .hint{ font-size:12px; color:var(--ink-soft); margin-bottom:6px; line-height:1.5; }
  .field input[type="text"], .field input[type="url"], .field textarea{
    width:100%; border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font-family:inherit; font-size:13px; color:var(--ink); background:var(--paper);
  }
  .field input:focus, .field textarea:focus{ outline:2px solid var(--blue); outline-offset:1px; border-color:var(--blue); }
  .field textarea{ min-height:58px; resize:vertical; line-height:1.5; }
  .picker-strip{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .thumb{
    width:52px; height:52px; padding:0; border:2px solid var(--line); border-radius:8px;
    background:var(--paper); cursor:pointer; overflow:hidden; flex:none;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb:hover{ border-color:var(--blue); }
  .thumb.selected{ border-color:var(--blue); box-shadow:0 0 0 2px rgba(12,112,232,.25); }
  .visually-hidden{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  .field .url-tag{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:9.5px;
    text-transform:uppercase; letter-spacing:.04em; color:#0A5FC5; background:#E7F0FD;
    padding:2px 6px; border-radius:5px; margin-left:6px; vertical-align:middle;
  }

  .actions{
    position:sticky; bottom:0; margin-top:16px; padding:14px; background:var(--surface);
    border:1px solid var(--line); border-radius:12px; display:flex; align-items:center; gap:12px;
    flex-wrap:wrap;
  }
  .actions button{
    appearance:none; border:none; background:var(--blue); color:#fff; font-family:inherit;
    font-weight:700; font-size:14px; padding:11px 20px; border-radius:9px; cursor:pointer;
  }
  .actions button:hover{ background:#0A5FC4; }
  .actions button.secondary{ background:none; border:1px solid var(--line); color:var(--ink-soft); font-weight:600; }
  .actions button.secondary:hover{ background:var(--line-soft); color:var(--ink); }
  .actions .status{ font-size:12.5px; color:var(--ink-soft); }
  .actions .status.ok{ color:var(--good); }

  .draft-note{
    display:flex; gap:8px; background:var(--line-soft); color:var(--ink-soft);
    border-radius:8px; padding:9px 12px; font-size:12px; line-height:1.5; margin-top:10px;
  }
  .draft-note b{ color:var(--ink); }

  .note{
    display:flex; gap:10px; background:var(--amber-bg);
    border:1px solid color-mix(in srgb, var(--amber) 35%, transparent);
    color:var(--ink); border-radius:10px; padding:11px 13px; font-size:12px;
    line-height:1.55; margin-bottom:16px;
  }
  .note b{ color:var(--amber); }

  .copy-guide-link{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600;
    color:var(--blue); text-decoration:none; margin-bottom:16px;
  }
  .copy-guide-link:hover{ text-decoration:underline; }

  .preview-col{ position:sticky; top:16px; }
  .preview-frame-wrap{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    overflow:hidden; display:flex; flex-direction:column;
  }
  .preview-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 14px; border-bottom:1px solid var(--line); background:var(--line-soft);
  }
  .preview-head .label{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase;
    letter-spacing:.05em; color:var(--ink-soft);
  }
  .preview-head .live-dot{
    display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--good);
    margin-right:6px; animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  iframe.preview-frame{
    width:100%; height:78vh; border:none; background:#EDF1F7;
  }
  .preview-frame-wrap.mobile{ max-width:400px; margin:0 auto; }

  .preview-toggle{ display:flex; gap:2px; background:var(--surface); border:1px solid var(--line); border-radius:7px; padding:2px; }
  .preview-toggle button{
    appearance:none; border:none; background:none; font-family:'IBM Plex Mono',monospace;
    font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);
    padding:4px 10px; border-radius:5px; cursor:pointer;
  }
  .preview-toggle button.active{ background:var(--navy); color:#fff; }
</style>
</head>
<body>

<header class="top">
  <div class="row">
    <div>
      <div class="eyebrow">PartsBase / GTM Templates</div>
      <h1>Email Template Builder — Live Preview</h1>
    </div>
  </div>
</header>

<div class="shell">
  <div class="layout">
    <nav class="picker" id="picker"></nav>
    <div id="panels-form" class="form-col"></div>
    <div class="preview-col">
      <div class="preview-frame-wrap">
        <div class="preview-head">
          <span class="label"><span class="live-dot"></span>Live preview</span>
          <div class="preview-toggle" role="group" aria-label="Preview width">
            <button type="button" class="active" data-mode="desktop" aria-pressed="true">Desktop</button>
            <button type="button" data-mode="mobile" aria-pressed="false">Mobile</button>
          </div>
          <span class="label" id="preview-name"></span>
        </div>
        <iframe class="preview-frame" id="preview-frame" title="Live preview"></iframe>
      </div>
    </div>
  </div>
</div>

<script src="resources/template-builder/fields-data.js?v=20260909d"></script>
<script src="resources/template-builder/assets-data.js?v=20260909e"></script>
<script src="resources/template-builder/generate.js?v=20260909d"></script>
<script>
const picker = document.getElementById('picker');
const panelsForm = document.getElementById('panels-form');
const previewFrame = document.getElementById('preview-frame');
const previewName = document.getElementById('preview-name');

let currentTemplate = null;
let masterCache = {};
let debounceTimer = null;
let previewMode = 'desktop';

function escAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
}

// Per-template drafts, so an accidental refresh doesn't lose typed copy.
const DRAFT_PREFIX = 'tb-draft-v1-';

function loadDraft(id) {
  try {
    const raw = localStorage.getItem(DRAFT_PREFIX + id);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function saveDraft(t) {
  try {
    const fields = {};
    t.fields.forEach(f => {
      const el = document.getElementById(`f-${t.id}-${f.id}`);
      if (el && el.value) fields[f.id] = el.value;
    });
    localStorage.setItem(DRAFT_PREFIX + t.id, JSON.stringify({ fields, excludedSections: [...excludedSections[t.id]] }));
  } catch {}
}

function pickerAssets(f) {
  if (!f.pickerCategories) return [];
  return ASSETS.filter(a => f.pickerCategories.includes(a.category));
}

function renderPicker(t, f) {
  const assets = pickerAssets(f);
  if (!assets.length) return '';
  const thumbs = assets.map(a => `
    <button type="button" class="thumb" data-url="${escAttr(a.url)}" data-target="f-${t.id}-${f.id}" title="${escAttr(a.label)}">
      <img src="${a.url}" alt="${escAttr(a.label)}" loading="lazy">
    </button>`).join('');
  return `<div class="picker-strip">${thumbs}</div>`;
}

function renderField(t, f) {
  const isUrl = f.type === 'url';
  const isTextarea = f.type === 'textarea';
  const hasPicker = pickerAssets(f).length > 0;
  const placeholder = f.example ? f.example.replace(/\n/g, ' / ') : '';
  const inputHtml = isTextarea
    ? `<textarea id="f-${t.id}-${f.id}" placeholder="${escAttr(placeholder)}" data-field="${f.id}"></textarea>`
    : `<input type="${isUrl ? 'url' : 'text'}" id="f-${t.id}-${f.id}" placeholder="${escAttr(placeholder)}" data-field="${f.id}"${hasPicker ? ' class="visually-hidden"' : ''}>`;
  return `<div class="field" data-field-wrap="${f.id}">
    <label for="f-${t.id}-${f.id}">${f.label}${(isUrl && !hasPicker) ? '<span class="url-tag">URL</span>' : ''}</label>
    ${f.hint ? `<div class="hint">${f.hint}</div>` : ''}
    ${renderPicker(t, f)}
    ${inputHtml}
  </div>`;
}

// Which sections are currently excluded, per template id.
const excludedSections = {};

TEMPLATES.forEach((t, i) => {
  excludedSections[t.id] = new Set();

  const btn = document.createElement('button');
  btn.className = 'picker-btn' + (i === 0 ? ' active' : '');
  btn.dataset.id = t.id;
  btn.innerHTML = `${t.name}<span class="n">${t.sections.length} section${t.sections.length === 1 ? '' : 's'}</span>`;
  btn.addEventListener('click', () => selectTemplate(t.id));
  picker.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'panel' + (i === 0 ? ' active' : '');
  panel.id = 'panel-' + t.id;

  const sectionedFieldIds = new Set();
  (t.sections || []).forEach(s => s.fields.forEach(fid => sectionedFieldIds.add(fid)));
  const looseFields = t.fields.filter(f => !sectionedFieldIds.has(f.id));

  const sectionCards = (t.sections || []).map(s => {
    const fields = t.fields.filter(f => s.fields.includes(f.id));
    return `<div class="panel-card section-card" data-section="${s.id}">
      <label class="section-toggle">
        <input type="checkbox" checked data-section-checkbox="${s.id}">
        <span>${s.label}</span>
        <span class="section-toggle-hint">Uncheck to leave this whole section out</span>
      </label>
      <div class="section-fields">${fields.map(f => renderField(t, f)).join('')}</div>
    </div>`;
  }).join('');

  const looseCard = looseFields.length
    ? `<div class="panel-card">${looseFields.map(f => renderField(t, f)).join('')}</div>`
    : '';

  panel.innerHTML = `
    <div class="panel-card">
      <h2>${t.name}</h2>
      <div class="use">${t.use}</div>
      <div class="note"><span>💡</span><span>Watch the preview on the right update as you type. Paste hosted image URLs (upload to HubSpot's File Manager first) — leave any field blank to keep the template's current content.${t.sections ? ' Uncheck a section below to leave it out of the email entirely.' : ''}</span></div>
      <a class="copy-guide-link" href="${t.copyGuideUrl}" target="_blank" rel="noopener">📄 Prefer to draft this in Word first? Open the Copy Guide</a>
    </div>
    ${sectionCards}
    ${looseCard}
    <div class="actions">
      <button id="gen-${t.id}">Generate &amp; Download</button>
      <button type="button" class="secondary" id="clear-${t.id}">Clear all fields</button>
      <span class="status" id="status-${t.id}"></span>
    </div>
  `;
  panelsForm.appendChild(panel);

  // Restore a saved draft, if one exists, before wiring up listeners.
  const draft = loadDraft(t.id);
  let restoredCount = 0;
  if (draft) {
    Object.entries(draft.fields || {}).forEach(([fid, val]) => {
      const el = document.getElementById(`f-${t.id}-${fid}`);
      if (el) { el.value = val; restoredCount++; }
    });
    (draft.excludedSections || []).forEach(sid => {
      const cb = panel.querySelector(`[data-section-checkbox="${sid}"]`);
      if (!cb) return;
      excludedSections[t.id].add(sid);
      cb.checked = false;
      const card = cb.closest('.section-card');
      card.classList.add('section-excluded');
      card.querySelectorAll('input, textarea, button').forEach(el => { if (el !== cb) el.disabled = true; });
    });
    panel.querySelectorAll('.thumb').forEach(btn => {
      const input = document.getElementById(btn.dataset.target);
      if (input && input.value === btn.dataset.url) btn.classList.add('selected');
    });
  }
  if (restoredCount > 0) {
    const notice = document.createElement('div');
    notice.className = 'draft-note';
    notice.innerHTML = `<span>📝</span><span>Draft restored from your last visit (${restoredCount} field${restoredCount === 1 ? '' : 's'}). Use <b>Clear all fields</b> below to start fresh.</span>`;
    panel.querySelector('.panel-card').appendChild(notice);
  }

  panel.querySelector(`#gen-${t.id}`).addEventListener('click', () => download(t));
  panel.querySelector(`#clear-${t.id}`).addEventListener('click', () => clearAllFields(t));
  panel.querySelectorAll('[data-field]').forEach(el => {
    el.addEventListener('input', () => scheduleRefresh(t));
  });
  panel.querySelectorAll('.thumb').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      input.value = btn.dataset.url;
      input.dispatchEvent(new Event('input'));
      btn.closest('.picker-strip').querySelectorAll('.thumb').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
  });
  panel.querySelectorAll('[data-section-checkbox]').forEach(cb => {
    cb.addEventListener('change', () => {
      const sid = cb.dataset.sectionCheckbox;
      const card = cb.closest('.section-card');
      if (cb.checked) excludedSections[t.id].delete(sid);
      else excludedSections[t.id].add(sid);
      card.classList.toggle('section-excluded', !cb.checked);
      card.querySelectorAll('input, textarea, button').forEach(el => {
        if (el !== cb) el.disabled = !cb.checked;
      });
      scheduleRefresh(t);
    });
  });
});

async function getMaster(t) {
  if (masterCache[t.id]) return masterCache[t.id];
  const res = await fetch(t.master, { cache: 'no-store' });
  const html = await res.text();
  masterCache[t.id] = html;
  return html;
}

function scheduleRefresh(t) {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => { refreshPreview(t); saveDraft(t); }, 350);
}

async function refreshPreview(t) {
  const masterHtml = await getMaster(t);
  const { html: out } = buildOutputHtml(t, masterHtml, (id) => document.getElementById(`f-${t.id}-${id}`).value, [...excludedSections[t.id]]);
  previewFrame.srcdoc = out;
  previewFrame.title = t.name + ' — live preview';
  previewName.textContent = t.name;
}

function clearAllFields(t) {
  const panel = document.getElementById('panel-' + t.id);
  const filled = t.fields.filter(f => {
    const el = document.getElementById(`f-${t.id}-${f.id}`);
    return el && el.value.trim();
  });
  const statusEl = document.getElementById('status-' + t.id);
  if (!filled.length) {
    statusEl.textContent = 'Nothing to clear.';
    statusEl.className = 'status';
    return;
  }
  const ok = confirm(`Clear all ${filled.length} field${filled.length === 1 ? '' : 's'} you've filled in for "${t.name}"? This can't be undone.`);
  if (!ok) return;
  filled.forEach(f => { document.getElementById(`f-${t.id}-${f.id}`).value = ''; });
  panel.querySelectorAll('.thumb.selected').forEach(b => b.classList.remove('selected'));
  saveDraft(t);
  refreshPreview(t);
  statusEl.textContent = `Cleared ${filled.length} field${filled.length === 1 ? '' : 's'}.`;
  statusEl.className = 'status';
}

document.querySelectorAll('.preview-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    previewMode = btn.dataset.mode;
    document.querySelectorAll('.preview-toggle button').forEach(b => {
      const active = b === btn;
      b.classList.toggle('active', active);
      b.setAttribute('aria-pressed', String(active));
    });
    document.querySelector('.preview-frame-wrap').classList.toggle('mobile', previewMode === 'mobile');
  });
});

async function selectTemplate(id) {
  document.querySelectorAll('.picker-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + id));
  currentTemplate = TEMPLATES.find(t => t.id === id);
  await refreshPreview(currentTemplate);
}

// Deep link from the template gallery: ?template=<id> preselects that template.
const requested = new URLSearchParams(location.search).get('template');
const startId = (requested && TEMPLATES.some(t => t.id === requested)) ? requested : TEMPLATES[0].id;
selectTemplate(startId);

async function download(t) {
  const statusEl = document.getElementById('status-' + t.id);
  const genBtn = document.getElementById('gen-' + t.id);
  statusEl.textContent = '';
  statusEl.className = 'status';
  genBtn.disabled = true;
  genBtn.textContent = 'Generating…';

  try {
    const masterHtml = await getMaster(t);
    const { html: out, filledCount } = buildOutputHtml(t, masterHtml, (id) => document.getElementById(`f-${t.id}-${id}`).value, [...excludedSections[t.id]]);

    const blob = new Blob([out], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = t.outputName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    statusEl.textContent = filledCount > 0
      ? `Downloaded — ${filledCount} field${filledCount === 1 ? '' : 's'} updated.`
      : 'Downloaded — no fields were filled in, so the template went out unchanged.';
    statusEl.classList.add('ok');
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Something went wrong: ' + err.message;
  } finally {
    genBtn.disabled = false;
    genBtn.textContent = 'Generate & Download';
  }
}
</script>
</body>
</html>
